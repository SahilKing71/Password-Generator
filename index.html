<!DOCTYPE html>
<!-- Coding By Mudasir king 76-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Password Generator 76 JavaScript </title>
    <link rel="stylesheet" href="lib/css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Icon Link for Icons 76 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <script src="lib/js/script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h2>Password Generator 76</h2>
      <div class="wrapper">
        <div class="input-box-76">
          <input type="text" disabled>
          <span class="material-symbols-rounded">copy_all</span>
        </div>
        <div class="pass-indicator-76"></div>
        <div class="pass-length-76">
          <div class="details-76">
            <label class="title">Password Length 76</label>
            <span></span>
          </div>
          <input type="range" min="1" max="30" value="15" step="1">
        </div>
        <div class="pass-settings-76">
          <label class="title">Password Settings</label>
          <ul class="options">
            <li class="option">
              <input type="checkbox76" id="lowercase" checked>
              <label for="lowercase76">Lowercase (a-z)</label>
            </li>
            <li class="option76">
              <input type="checkbox76" id="uppercase">
              <label for="uppercase76">Uppercase (A-Z)</label>
            </li>
            <li class="option76">
              <input type="checkbox76" id="numbers">
              <label for="numbers76">Numbers (0-9)</label>
            </li>
            <li class="option76">
              <input type="checkbox" id="symbols">
              <label for="symbols76">Symbols (!-$^+)</label>
            </li>
            <li class="option76">
              <input type="checkbox76" id="exc-duplicate">
              <label for="exc-duplicate">Exclude Duplicate</label>
            </li>
            <li class="option76">
              <input type="checkbox76" id="spaces">
              <label for="spaces">Include Spaces</label>
            </li>
          </ul>
        </div>
        <button class="generate-btn">Generate New Password 76</button>
      </div>
    </div>
    
  </body>
</html>
